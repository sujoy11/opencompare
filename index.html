<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>OpenCompare — Compare Anything. Decide Smarter.</title>
<style>
  :root{
    --bg:#ffffff;--bg2:#f7f8fb;--card:#ffffff;--text:#0f172a;--muted:#64748b;
    --border:#e6e9ef;--pri:#4f46e5;--pri2:#06b6d4;
    --a:#4f46e5;--b:#f59e0b;--green:#10b981;--red:#ef4444;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -12px rgba(15,23,42,.08);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;width:100%;}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:15px;}
  .wrap{max-width:980px;margin:0 auto;padding:0 18px;width:100%;}
  header{text-align:center;padding:56px 0 4px;}
  .logo{font-size:clamp(30px,7vw,40px);font-weight:800;letter-spacing:-1.5px;color:var(--text);}
  .logo span{color:var(--pri);}
  .tag{color:var(--muted);font-size:16px;margin-top:10px;font-weight:500;}
  .hero-sub{font-size:13px;color:var(--muted);margin-top:6px;letter-spacing:.2px;}

  .comparator{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(20px,4vw,30px);margin:32px 0 16px;box-shadow:var(--shadow);}
  .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;}
  .lbl{font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:9px;display:block;}
  .lbl.a{color:var(--a);} .lbl.b{color:var(--b);}
  .inp{background:var(--bg2);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:16px;font-size:16px;width:100%;font-family:inherit;transition:.15s;min-width:0;}
  .inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.12);}
  .vsbadge{font-weight:900;font-size:20px;color:var(--muted);padding-bottom:14px;white-space:nowrap;}
  .go{display:block;width:100%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:none;padding:16px;border-radius:13px;font-weight:800;font-size:18px;cursor:pointer;margin-top:18px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .go:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(79,70,229,.25);}
  .go:disabled{opacity:.6;cursor:wait;}
  .chips{text-align:center;margin-top:18px;color:var(--muted);font-size:13px;line-height:2.6;}
  .chip{display:inline-block;background:var(--bg2);border:1px solid var(--border);padding:6px 13px;border-radius:999px;margin:4px;cursor:pointer;font-size:12px;transition:.15s;}
  .chip:hover{border-color:var(--pri);color:var(--pri);}

  .result{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(20px,4vw,32px);margin-bottom:24px;box-shadow:var(--shadow);animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .rtitle{font-size:clamp(20px,5vw,26px);font-weight:800;text-align:center;margin-bottom:24px;line-height:1.3;word-break:break-word;}
  .rtitle .ra{color:var(--a);} .rtitle .rb{color:var(--b);}
  .scores{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;}
  .score{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px 16px;text-align:center;}
  .score .n{font-size:clamp(36px,9vw,46px);font-weight:800;line-height:1;}
  .score.a .n{color:var(--a);} .score.b .n{color:var(--b);}
  .score .l{color:var(--muted);font-size:13px;margin-top:9px;font-weight:600;}
  .winner{text-align:center;font-size:15px;font-weight:800;padding:14px 16px;border-radius:13px;margin-bottom:24px;line-height:1.5;}
  .winner.a{background:rgba(79,70,229,.08);border:1px solid rgba(79,70,229,.25);color:var(--a);}
  .winner.b{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#b45309;}
  .winner.tie{background:var(--bg2);border:1px solid var(--border);color:var(--muted);}
  .sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:28px 0 12px;display:flex;align-items:center;gap:8px;}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--border);}
  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;min-width:280px;}
  th,td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:14px;vertical-align:top;word-break:break-word;}
  th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;width:130px;white-space:nowrap;}
  td.a{color:var(--a);font-weight:700;} td.b{color:var(--b);font-weight:700;}
  .pc{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .pcol{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;min-width:0;}
  .pcol h4{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .pcol.a h4{color:var(--a);} .pcol.b h4{color:var(--b);}
  .pcol ul{list-style:none;}
  .pcol li{font-size:13px;padding:6px 0;color:var(--text);display:flex;gap:9px;align:flex-start;line-height:1.5;}
  .pcol.pros li::before{content:"✓";color:var(--green);font-weight:800;flex-shrink:0;}
  .pcol.cons li::before{content:"✕";color:var(--red);font-weight:800;flex-shrink:0;}
  .sum{background:linear-gradient(135deg,rgba(79,70,229,.06),rgba(6,182,212,.06));border:1px solid var(--border);border-left:4px solid var(--pri);border-radius:12px;padding:18px;font-size:14px;line-height:1.7;}
  .rec{background:#fff7ed;border:1px solid #fed7aa;border-left:4px solid var(--b);border-radius:12px;padding:18px;font-size:14px;margin-top:16px;line-height:1.7;}
  .alts{margin-top:16px;display:flex;gap:9px;flex-wrap:wrap;}
  .alt{background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--muted);}
  .best{text-align:center;font-size:14px;color:var(--muted);margin-top:18px;font-style:italic;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .loading{text-align:center;padding:56px 16px;color:var(--muted);}
  .spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 16px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:32px 0 44px;line-height:1.7;}

  @media(max-width:560px){
    .vs{grid-template-columns:1fr;gap:12px;}
    .vsbadge{text-align:center;padding:2px 0;}
    .scores{grid-template-columns:1fr;}
    .pc{grid-template-columns:1fr;}
    th{width:110px;white-space:normal;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Open<span>Compare</span></div>
    <div class="tag">Compare Anything. Decide Smarter.</div>
    <div class="hero-sub">AI-powered · neutral · instant</div>
  </header>

  <div class="comparator">
    <div class="vs">
      <div class="field a">
        <label class="lbl a">ITEM A</label>
        <input class="inp" id="a" placeholder="e.g. ChatGPT" autocomplete="off" />
      </div>
      <div class="vsbadge">VS</div>
      <div class="field b">
        <label class="lbl b">ITEM B</label>
        <input class="inp" id="b" placeholder="e.g. Claude" autocomplete="off" />
      </div>
    </div>
    <button class="go" id="btn" onclick="compare()">⚡ Compare Now</button>
    <div class="chips">
      Try:
      <span class="chip" onclick="setEx('ChatGPT','Claude')">ChatGPT vs Claude</span>
      <span class="chip" onclick="setEx('Notion','Obsidian')">Notion vs Obsidian</span>
      <span class="chip" onclick="setEx('iPhone','Samsung')">iPhone vs Samsung</span>
      <span class="chip" onclick="setEx('Hostinger','Cloudflare')">Hostinger vs Cloudflare</span>
    </div>
  </div>

  <div id="out"></div>

  <footer>
    OpenCompare · AI comparison engine<br/>
    Built with Python + Gemini · Minimalist MVP
  </footer>
</div>

<script>
  function setEx(a,b){document.getElementById('a').value=a;document.getElementById('b').value=b;}
  async function compare(){
    const a=document.getElementById('a').value.trim();
    const b=document.getElementById('b').value.trim();
    if(!a||!b){alert('Both items required');return;}
    const btn=document.getElementById('btn');
    btn.disabled=true; btn.textContent='Analyzing…';
    const out=document.getElementById('out');
    out.innerHTML='<div class="loading"><div class="spin"></div>AI is comparing '+a+' vs '+b+'…</div>';
    try{
      const r=await fetch('/api/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_a:a,item_b:b})});
      const d=await r.json();
      if(!d.ok){out.innerHTML='<div class="loading">Error: '+d.error+'</div>';return;}
      render(d.item);
    }catch(e){out.innerHTML='<div class="loading">Failed: '+e+'</div>';}
    finally{btn.disabled=false; btn.textContent='⚡ Compare Now';}
  }
  function render(item){
    const a=item.item_a,b=item.item_b,res=item.result;
    const sa=res.scores.a, sb=res.scores.b;
    const m=(res.metrics||[]).map(x=>`<tr><th>${x.label}</th><td class="a">${x.a}</td><td class="b">${x.b}</td></tr>`).join('');
    let wcls='tie', wtxt='Tie';
    if(res.winner==='A'){wcls='a';wtxt=a;}else if(res.winner==='B'){wcls='b';wtxt=b;}
    const alts=(res.alternatives||[]).map(x=>`<span class="alt">${x}</span>`).join('');
    document.getElementById('out').innerHTML=`
      <div class="result">
        <div class="rtitle"><span class="ra">${a}</span> <span style="color:var(--muted)">vs</span> <span class="rb">${b}</span></div>
        <div class="scores">
          <div class="score a"><div class="n">${sa}</div><div class="l">${a} Score</div></div>
          <div class="score b"><div class="n">${sb}</div><div class="l">${b} Score</div></div>
        </div>
        <div class="winner ${wcls}">🏆 Overall Winner: ${wtxt} &nbsp;·&nbsp; ${sa} / ${sb}</div>

        <div class="sec-title">Detailed Comparison</div>
        <div class="table-wrap"><table>${m}</table></div>

        <div class="sec-title">Strengths &amp; Weaknesses</div>
        <div class="pc">
          <div class="pcol a pros"><h4>✅ ${a} — Pros</h4><ul>${(res.a_pros||[]).map(x=>`<li>${x}</li>`).join('')}</ul></div>
          <div class="pcol a cons"><h4>⚠️ ${a} — Cons</h4><ul>${(res.a_cons||[]).map(x=>`<li>${x}</li>`).join('')}</ul></div>
        </div>
        <div class="pc" style="margin-top:14px;">
          <div class="pcol b pros"><h4>✅ ${b} — Pros</h4><ul>${(res.b_pros||[]).map(x=>`<li>${x}</li>`).join('')}</ul></div>
          <div class="pcol b cons"><h4>⚠️ ${b} — Cons</h4><ul>${(res.b_cons||[]).map(x=>`<li>${x}</li>`).join('')}</ul></div>
        </div>

        <div class="sec-title">AI Summary</div>
        <div class="sum">${res.summary}</div>

        <div class="sec-title">Our Recommendation</div>
        <div class="rec">💡 ${res.recommendation}</div>

        <div class="best">🎯 Best for: ${res.best_for}</div>
        ${alts?`<div class="alts">${alts}</div>`:''}
      </div>`;
    window.scrollTo({top:document.querySelector('.result').offsetTop-20,behavior:'smooth'});
  }
</script>
</body>
</html>
